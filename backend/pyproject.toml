[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-translate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "charset-normalizer>=3.3",
  "ctranslate2>=4.3",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "huggingface_hub>=0.24",
  "python-multipart>=0.0.9",
  "send2trash>=1.8",
  "pyyaml>=6",
  "httpx>=0.27",
  "ebooklib>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.honorific" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not db and not slow and not live"'
markers = [
  "db: cần Postgres (make db)",
  "slow: nạp model HachimiMT thật",
  "live: gọi DeepSeek API thật",
]
