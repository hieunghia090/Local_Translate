services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: local_translate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: local_translate
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_translate"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
